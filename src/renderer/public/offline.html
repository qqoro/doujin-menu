<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>동인메뉴판</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        box-sizing: border-box;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        text-align: center;
      }
      main {
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #a1a1aa;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #fafafa;
        color: #09090b;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./pwa/icon-192.png" alt="" />
      <h1>PC에서 동인메뉴판이 꺼져 있습니다</h1>
      <p>
        PC에서 동인메뉴판을 켜고, 모바일 페이지에서 '모바일 접속'이 켜져 있는지
        확인한 뒤 다시 시도하세요.
      </p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
